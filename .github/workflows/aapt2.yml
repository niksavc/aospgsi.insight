name: Build aapt2 for Android

# Builds aapt2 from AOSP sources (see scripts/build-aapt2.sh). Reusable: the main build calls it and
# caches the result, so the long compile only runs when the script, tag or pins change.
on:
  workflow_call:
    inputs:
      matrix:
        description: 'JSON array of {"abi": ..., "api": ...}'
        type: string
        required: true
  # Probe builds: push to this branch to try the build without touching the main workflow.
  push:
    branches: [claude/aapt2]
    paths: ['scripts/build-aapt2.sh', '.github/workflows/aapt2.yml']

permissions:
  contents: read

jobs:
  aapt2:
    name: aapt2 ${{ matrix.abi }} (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.matrix || '[{"abi":"arm64-v8a","api":24},{"abi":"arm64-v8a","api":30}]') }}

    steps:
      - uses: actions/checkout@v5

      - name: Restore cached binary
        id: cache
        uses: actions/cache@v4
        with:
          path: out/aapt2/${{ matrix.abi }}
          key: aapt2-${{ matrix.abi }}-api${{ matrix.api }}-${{ hashFiles('scripts/build-aapt2.sh') }}

      - name: Install build dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ninja-build bison flex python3-requests

      - uses: actions/setup-go@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false

      - name: Build aapt2
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          WORK_DIR: ${{ runner.temp }}/aapt2
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_ROOT}"
          echo "NDK: $ANDROID_NDK_HOME"
          scripts/build-aapt2.sh "${{ matrix.abi }}" "${{ matrix.api }}" "out/aapt2/${{ matrix.abi }}" 2>&1 | tee build-aapt2.log

      - name: Report build info and failures
        if: always()
        shell: bash
        run: |
          if [ -f out/aapt2/${{ matrix.abi }}/BUILDINFO.txt ]; then
            msg=$(sed ':a;N;$!ba;s/\n/%0A/g' out/aapt2/${{ matrix.abi }}/BUILDINFO.txt)
            echo "::notice title=aapt2 ${{ matrix.abi }} api${{ matrix.api }}::$msg"
          elif [ -f build-aapt2.log ]; then
            msg=$( { grep -E "^::error|^::warning|FAILED|error:|Error |No such file|fatal|undefined reference|cannot find|missing" build-aapt2.log | head -n 40; echo '--- tail ---'; tail -n 25 build-aapt2.log; } | cut -c1-400 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=aapt2 ${{ matrix.abi }} api${{ matrix.api }}::$msg"
          fi

      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: aapt2-${{ matrix.abi }}-api${{ matrix.api }}
          path: out/aapt2/${{ matrix.abi }}
          if-no-files-found: error
          retention-days: 30

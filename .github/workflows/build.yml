name: BloxInsight Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloxinsight-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BloxInsight APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs a Gradle distribution without requiring gradlew in the repository.
      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Verify project structure
        run: |
          echo 'Checking repository structure...'
          ls -la
          test -f settings.gradle.kts || { echo 'Missing settings.gradle.kts'; exit 1; }
          test -f androidApp/build.gradle.kts || { echo 'Missing androidApp/build.gradle.kts'; exit 1; }
          gradle --version

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :androidApp:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-build-diagnostics
          path: |
            build.log
            test.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

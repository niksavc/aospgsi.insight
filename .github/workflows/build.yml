name: BloxInsight Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK manager
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found in $ANDROID_HOME"
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        shell: bash
        run: |
          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          set +o pipefail
          yes | "$SDKMANAGER" --licenses
          RESULT=${PIPESTATUS[1]}
          if [ "$RESULT" -ne 0 ]; then
            echo "::error::Android SDK license acceptance failed"
            exit "$RESULT"
          fi

      - name: Verify Android SDK
        shell: bash
        run: |
          "$SDKMANAGER" --list_installed
          adb version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        shell: bash
        run: |
          if [ ! -f ./gradlew ]; then
            echo "::error::gradlew is missing from the repository root"
            exit 1
          fi
          chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew :androidApp:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: bloxinsight-debug
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7

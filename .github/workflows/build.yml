name: BloxInsight Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloxinsight-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BloxInsight APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Installs a Gradle distribution without requiring gradlew in the repository.
      - name: Set up Gradle 9.8.1
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.8.1'

      - name: Verify project structure
        run: |
          echo 'Checking repository structure...'
          ls -la
          test -f settings.gradle.kts || { echo 'Missing settings.gradle.kts'; exit 1; }
          test -f androidApp/build.gradle.kts || { echo 'Missing androidApp/build.gradle.kts'; exit 1; }
          gradle --version

      - name: Check formatting (Spotless / ktlint)
        shell: bash
        run: |
          set -o pipefail
          gradle spotlessCheck --no-daemon --stacktrace 2>&1 | tee lint.log

      - name: Run unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle testAndroidHostTest --no-daemon --stacktrace 2>&1 | tee test.log

      - name: Verify tests actually ran
        shell: bash
        run: |
          count=$(find . -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 \
            | xargs -0 grep -ho 'tests="[0-9]*"' | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "Executed tests: $count"
          test "$count" -ge 6

      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :androidApp:assembleDebug --no-daemon --stacktrace --warning-mode all 2>&1 | tee build.log

      - name: Verify APK SDK levels
        shell: bash
        run: |
          apk=$(ls androidApp/build/outputs/apk/debug/*.apk | head -n 1)
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -n 1)
          "$aapt2" dump badging "$apk" | grep -E "^package:|^sdkVersion|^targetSdkVersion"
          "$aapt2" dump badging "$apk" | grep -q "^targetSdkVersion:'37'"
          "$aapt2" dump badging "$apk" | grep -q "compileSdkVersion='37'"

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-build-diagnostics
          path: |
            build.log
            test.log
            lint.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

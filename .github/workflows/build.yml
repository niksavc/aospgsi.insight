name: BloxInsight Android Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bloxinsight-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build BloxInsight APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Download repository source
      - name: Checkout repository
        uses: actions/checkout@v5

      # 2. Configure Java
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # 3. Configure Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      # 4. Check project files and Gradle Wrapper
      - name: Verify project structure
        shell: bash
        run: |
          echo "Checking repository structure..."
          pwd
          ls -la

          if [ ! -f settings.gradle ] && [ ! -f settings.gradle.kts ]; then
            echo "::error::Missing settings.gradle or settings.gradle.kts"
            exit 1
          fi

          if [ ! -f gradlew ]; then
            echo "::error::gradlew is missing from the repository root."
            echo "Commit the Gradle Wrapper files before building."
            exit 1
          fi

          if [ ! -f gradle/wrapper/gradle-wrapper.properties ]; then
            echo "::error::Missing gradle/wrapper/gradle-wrapper.properties"
            exit 1
          fi

          chmod +x gradlew

      # 5. Display Gradle and Java versions
      - name: Verify Java and Gradle
        run: |
          java -version
          ./gradlew --version

      # 6. Build the Android debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            2>&1 | tee build.log

      # 7. Upload APK when the build succeeds
      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 8. Upload logs and reports when the build fails
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: BloxInsight-build-diagnostics
          path: |
            build.log
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: warn
          retention-days: 7

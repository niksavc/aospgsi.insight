[versions]
# Select and pin mutually compatible versions in Android Studio before building.
kotlin = "2.4.10"
agp = "9.4.0"
compose-multiplatform = "1.12.1"

android-minSdk = "24"
android-targetSdk = "37"
android-compileSdk = "37"

apktool = "3.0.3"
desugar-jdk-libs = "2.1.5"

androidx-activity = "1.9.3"
androidx-compose-bom = "2026.08.00"

spotless = "8.10.4"
ktfmt = "0.65"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "androidx-compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
apktool-lib = { module = "org.apktool:apktool-lib", version.ref = "apktool" }
desugar-jdk-libs-nio = { module = "com.android.tools:desugar_jdk_libs_nio", version.ref = "desugar-jdk-libs" }
# apksig is versioned together with the Android Gradle plugin.
apksig = { module = "com.android.tools.build:apksig", version.ref = "agp" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }

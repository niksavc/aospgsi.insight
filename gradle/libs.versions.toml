[versions]
# Select and pin mutually compatible versions in Android Studio before building.
kotlin = "2.2.20"
agp = "9.1.1"
compose-multiplatform = "1.9.3"

android-minSdk = "24"
android-targetSdk = "37"
android-compileSdk = "37"

androidx-activity = "1.9.3"
androidx-compose-material3 = "1.3.1"

spotless = "7.2.1"
ktlint = "1.5.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "androidx-compose-material3" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
